[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-engine"
version = "0.1.0"
description = "Curve-fitting and biostatistics engine (runs natively and in Pyodide)"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
include = ["prism_engine*"]
