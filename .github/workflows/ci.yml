# Engine tests + web build on every push. The site is hosted on Cloudflare
# at opendose.erenozen.dev (wrangler.jsonc); this workflow does not deploy.
# To publish: cd web && npm ci && npm run build && cd .. && npx wrangler deploy
name: CI

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine + test deps
        run: |
          python -m pip install -e engine
          python -m pip install pytest statsmodels pandas openpyxl "pingouin>=0.7"
      - name: Run engine tests
        run: python -m pytest engine/tests -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        run: |
          cd web
          npm ci
          npm run build
