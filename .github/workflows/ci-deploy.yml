# Engine tests + web build on every push; deploys web/dist to GitHub
# Pages, but only once the repository is public (Pages on private repos
# needs a paid plan) — until then the deploy job is skipped, so CI stays
# green.
name: CI & deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine + test deps
        run: |
          python -m pip install -e engine
          python -m pip install pytest statsmodels pandas openpyxl pingouin
      - name: Run engine tests
        run: python -m pytest engine/tests -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        run: |
          cd web
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    # Pages needs a public repo (or a paid plan) — skip quietly until then
    if: ${{ !github.event.repository.private }}
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
